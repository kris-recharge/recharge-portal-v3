<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- v3.2: favicon switched from crown to ReCharge Alaska logo -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- v3.4: installable PWA + Web Push. iOS only allows Web Push for a site
         that has been added to the Home Screen AND ships a manifest with
         display:standalone — a Safari tab cannot subscribe. Vite rewrites these
         root-relative hrefs to /app/ at build time. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ReCharge" />
    <meta name="theme-color" content="#ffffff" />

    <title>ReCharge Alaska Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
